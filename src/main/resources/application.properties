spring.application.name=sintese-api

server.port=${PORT:8080}

gemini.api-key=${GEMINI_API_KEY}
gemini.url=https://generativelanguage.googleapis.com/v1beta/interactions
gemini.model=gemini-3.8-flash
gemini.api-revision=2026-05-20
gemini.timeout-seconds=25
gemini.thinking-level=low
gemini.temperature=0.1

sintese.max-palavras-entrada=50000
sintese.min-output-tokens-limit=500

# Upload de documentos (multipart/form-data)
app.upload.max-file-size=10MB
app.upload.max-request-size=30MB
spring.servlet.multipart.max-file-size=${app.upload.max-file-size}
spring.servlet.multipart.max-request-size=${app.upload.max-request-size}

app.expose-errors=${EXPOSE_ERRORS:false}
gemini.max-retries=2
gemini.retry-backoff-ms=1000

# Rate limit por IP para os endpoints de síntese
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Rate limit: lista explícita de IPs de proxies reversos confiáveis (separados por vírgula).
# Deixe vazio quando a cadeia de proxies não puder ser confirmada; nesse caso o filtro usa request.getRemoteAddr().
# X-Forwarded-For só é considerado quando remoteAddr pertence a um proxy confiável.
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

# Forwarded headers: manter conservador. O RateLimitFilter não depende de ForwardedHeaderFilter para identificar cliente.
server.forward-headers-strategy=none
